<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #070c2a; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #title {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #f3e6da; font-family: 'Cormorant Garamond', serif; pointer-events: none;
        transition: opacity 3s ease; text-shadow: 0 0 30px rgba(255, 180, 107, 0.35);
      }
      #title h1 { font-weight: 300; letter-spacing: 0.6em; font-size: clamp(42px, 7vw, 96px); margin: 0 0 0 0.6em; }
      #title p { font-style: italic; font-weight: 300; letter-spacing: 0.2em; opacity: 0.7; margin-top: 12px; }
      #hint {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
        color: rgba(243, 230, 218, 0.55); font-family: 'Cormorant Garamond', serif; font-size: 16px; letter-spacing: 0.15em;
        pointer-events: none; transition: opacity 2s ease; white-space: nowrap;
      }
      #prompt {
        position: fixed; left: 50%; top: 62%; transform: translateX(-50%);
        color: #f3e6da; font-family: 'Cormorant Garamond', serif; font-size: 20px; letter-spacing: 0.2em; font-style: italic;
        opacity: 0; transition: opacity 0.6s ease; pointer-events: none; white-space: nowrap;
      }
      #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f3e6da; font-family: sans-serif; padding: 24px; text-align: center; }
      #fade { position: fixed; inset: 0; background: #02030a; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
      .line {
        position: fixed; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
        font-family: 'Cormorant Garamond', serif; color: #f3e6da; opacity: 0; transition-property: opacity; transition-timing-function: ease;
        max-width: min(80vw, 900px); text-shadow: 0 0 24px rgba(10, 16, 60, 0.9), 0 0 40px rgba(255, 176, 101, 0.18);
      }
      .line.memory { top: 38%; font-style: italic; font-weight: 400; font-size: clamp(24px, 3.2vw, 42px); letter-spacing: 0.03em; }
      .line.whisper { top: 46%; font-style: italic; font-weight: 300; font-size: clamp(18px, 2vw, 26px); letter-spacing: 0.3em; color: #c9cfee; }
      .line.title { top: 34%; font-weight: 300; font-size: clamp(28px, 4vw, 56px); letter-spacing: 0.55em; }
      .line.observation { bottom: 14%; font-style: italic; font-weight: 300; font-size: clamp(16px, 1.6vw, 22px); letter-spacing: 0.06em; opacity: 0; }
      .line.hint { bottom: 14%; font-weight: 300; font-size: clamp(14px, 1.2vw, 17px); letter-spacing: 0.2em; color: rgba(243, 230, 218, 0.7); white-space: pre-wrap; }
      .line.wisp {
        bottom: 13%; font-weight: 400; font-size: clamp(17px, 1.7vw, 23px); letter-spacing: 0.03em; color: #e3f1ff;
        padding: 12px 22px 12px 48px; border-radius: 24px; background: rgba(8, 16, 48, 0.55); border: 1px solid rgba(159, 212, 255, 0.35);
        box-shadow: 0 0 30px rgba(159, 212, 255, 0.18); text-shadow: none;
      }
      .line.wisp .orb {
        position: absolute; left: 18px; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%;
        background: radial-gradient(circle, #ffffff 0%, #9fd4ff 45%, rgba(159, 212, 255, 0) 75%); box-shadow: 0 0 14px #9fd4ff;
        animation: orb 1.2s ease-in-out infinite;
      }
      @keyframes orb { 50% { transform: scale(1.25); } }
      #note {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -46%) rotate(-2deg); width: min(420px, 80vw); padding: 44px 40px;
        background: #e9dfcf; color: #23243a; font-family: 'Caveat', cursive; font-size: 40px; line-height: 1.2; text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 10, 0.6); opacity: 0; pointer-events: none; transition: opacity 0.8s ease, transform 0.8s ease;
        background-image: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.35), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(120,90,60,0.18), transparent 50%);
      }
      #note.open { opacity: 1; transform: translate(-50%, -50%) rotate(-2deg); }
      #note p { margin: 0; }
      .line .caption { display: block; font-size: 0.42em; letter-spacing: 0.45em; text-transform: lowercase; opacity: 0.55; margin-bottom: 0.6em; font-style: normal; }
      #storybook {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, 84vw); text-align: center;
        font-family: 'Cormorant Garamond', serif; color: #e9e2f2; pointer-events: none; transition: opacity 1.6s ease;
      }
      #storybook p { margin: 0 0 18px; font-style: italic; font-weight: 300; font-size: clamp(19px, 2.1vw, 28px); letter-spacing: 0.04em; opacity: 0; transition: opacity 1.8s ease; }
      #storybook p.rule { margin-top: 38px; font-style: normal; letter-spacing: 0.22em; color: #ffd4a8; text-shadow: 0 0 26px rgba(255, 176, 101, 0.35); }
      #objective {
        position: fixed; top: 22px; left: 26px; color: rgba(243, 230, 218, 0.78); font-family: 'Cormorant Garamond', serif; pointer-events: none;
        opacity: 0; transition: opacity 2s ease; text-shadow: 0 0 18px rgba(5, 8, 30, 0.9);
      }
      #objective .obj-title { font-size: 20px; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 300; }
      #objective .obj-line { font-size: 15px; font-style: italic; letter-spacing: 0.06em; margin-top: 6px; opacity: 0.8; }
      #objective .dots i { display: inline-block; width: 7px; height: 7px; margin-left: 7px; border-radius: 50%; border: 1px solid rgba(243, 230, 218, 0.6); vertical-align: middle; }
      #objective .dots i.carried { border-color: #ffb065; box-shadow: 0 0 8px rgba(255, 176, 101, 0.6); animation: carry 1.6s ease-in-out infinite; }
      @keyframes carry { 50% { background: rgba(255, 176, 101, 0.45); } }
      #objective .dots i.lit { background: #ffb065; border-color: #ffb065; box-shadow: 0 0 10px #ffb065; }
      #menu {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 20;
        background: rgba(4, 7, 26, 0.55); backdrop-filter: blur(7px) saturate(0.8); -webkit-backdrop-filter: blur(7px) saturate(0.8);
        opacity: 0; pointer-events: none; transition: opacity 0.35s ease; font-family: 'Cormorant Garamond', serif; color: #f3e6da;
      }
      #menu.open { opacity: 1; pointer-events: auto; }
      #map {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 19;
        background: rgba(4, 7, 26, 0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0; pointer-events: none; transition: opacity 0.35s ease; font-family: 'Cormorant Garamond', serif; color: #f3e6da;
      }
      #map.open { opacity: 1; }
      #endcard { position: fixed; inset: 0; z-index: 25; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #02030a; color: #f3e6da; font-family: 'Cormorant Garamond', serif; opacity: 0; transition: opacity 3s ease; cursor: pointer; }
      #endcard.open { opacity: 1; }
      #endcard .t { font-size: 54px; font-weight: 300; letter-spacing: 0.4em; }
      #endcard .s { font-style: italic; letter-spacing: 0.3em; opacity: 0.6; }
      #endcard .thanks { margin-top: 40px; font-size: 20px; font-style: italic; letter-spacing: 0.15em; opacity: 0.8; }
      #endcard .go { margin-top: 60px; font-size: 14px; letter-spacing: 0.3em; opacity: 0.45; }
      #satchel {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 19;
        background: rgba(4, 7, 26, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        opacity: 0; pointer-events: none; transition: opacity 0.35s ease; font-family: 'Cormorant Garamond', serif; color: #2a1e3a;
      }
      #satchel.open { opacity: 1; pointer-events: auto; }
      #satchel .ks.has { cursor: pointer; border-radius: 4px; padding: 4px 6px; margin-left: -6px; }
      #satchel .ks.has:hover { background: rgba(138, 74, 16, 0.08); }
      #satchel .ks.held { background: rgba(194, 122, 42, 0.16); }
      #satchel .name b { font-weight: 600; font-size: 14px; margin-right: 4px; opacity: 0.6; }
      #satchel .name i { font-size: 14px; color: #8a4a10; margin-left: 6px; }
      #satchel .what .use { display: block; margin-top: 2px; opacity: 0.9; }
      #hotbar { position: fixed; left: 22px; bottom: 20px; display: flex; gap: 8px; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; z-index: 5; }
      #hotbar.show { opacity: 1; }
      #hotbar .slot { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(243, 230, 218, 0.18); background: rgba(6, 10, 34, 0.35);
        transition: border-color 0.4s, background 0.4s, transform 0.4s, box-shadow 0.8s; }
      #hotbar .slot.has { border-color: rgba(243, 230, 218, 0.5); }
      #hotbar .slot.held { border-color: #ffc070; background: rgba(255, 176, 101, 0.16); transform: translateY(-4px); box-shadow: 0 0 14px rgba(255, 176, 101, 0.35); }
      #hotbar .slot.fresh { box-shadow: 0 0 22px rgba(255, 200, 150, 0.9); animation: slot-in 1.6s ease-out; }
      @keyframes slot-in { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
      #hotbar svg { width: 100%; height: 100%; fill: none; stroke: #f3e6da; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
      #hotbar span { position: absolute; right: -2px; bottom: -4px; font: 11px 'Cormorant Garamond', serif; color: rgba(243, 230, 218, 0.7); }
      #light-gauge { position: fixed; left: 24px; bottom: 70px; display: flex; align-items: center; gap: 7px; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; z-index: 5; }
      #light-gauge.show { opacity: 1; }
      #light-gauge .key { font: 11px 'Cormorant Garamond', serif; color: rgba(243, 230, 218, 0.35); margin-right: 2px; transition: color 0.4s; }
      #light-gauge.ready .key { color: rgba(255, 214, 160, 0.85); }
      #light-gauge i { --fill: 0; position: relative; width: 26px; height: 9px; border-radius: 5px; border: 1px solid rgba(243, 230, 218, 0.28); background: rgba(6, 10, 34, 0.4); overflow: hidden; transition: box-shadow 0.6s, border-color 0.6s; }
      #light-gauge i::after { content: ''; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--fill)); background: linear-gradient(90deg, #ffb066, #ffe3b0); transition: transform 0.25s linear; }
      #light-gauge i.full { border-color: rgba(255, 214, 160, 0.8); box-shadow: 0 0 10px rgba(255, 190, 120, 0.55); }
      #light-gauge.gathering i { animation: gauge-draw 1.2s ease-in-out infinite; }
      @keyframes gauge-draw { 50% { box-shadow: 0 0 14px rgba(255, 220, 170, 0.9); } }
      #light-gauge.spent { animation: gauge-spent 0.7s ease-out; }
      @keyframes gauge-spent { 0% { filter: brightness(2.4); transform: translateY(-3px); } 100% { filter: none; transform: none; } }
      #rest-glow { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; z-index: 6;
        background: radial-gradient(ellipse at 50% 35%, rgba(255, 196, 130, 0.0) 20%, rgba(255, 170, 100, 0.28) 60%, rgba(60, 28, 10, 0.75) 100%); }
      #rest-glow.on { opacity: 1; }
      #memory-film { position: fixed; inset: 0; z-index: 12; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.9s ease; }
      #memory-film.open { opacity: 1; pointer-events: auto; cursor: pointer; }
      #memory-film video { width: 100%; height: 100%; object-fit: cover; }
      #shell-cue { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.1s ease-out; z-index: 4;
        background: radial-gradient(circle at var(--x, 50%) var(--y, 0%), rgba(255, 184, 200, 0.55), rgba(255, 184, 200, 0.12) 18%, transparent 34%); }
      #satchel .page { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: min(980px, 92vw); max-height: 88vh; overflow-y: auto;
        padding: 34px 40px 46px; background: #d9ccb0; box-shadow: 0 20px 60px rgba(0,0,0,0.5); transform: rotate(0.4deg); }
      #satchel .head { font-size: 26px; letter-spacing: 0.35em; text-transform: uppercase; margin-bottom: 16px; }
      #satchel .label { font-size: 13px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.6; margin: 22px 0 10px; }
      #satchel .carry { font-size: 18px; font-style: italic; margin: 0; }
      #satchel .carry span { font-size: 15px; opacity: 0.7; }
      #satchel .carry.quiet { opacity: 0.55; }
      #satchel .ks { display: flex; gap: 14px; align-items: center; margin: 10px 0; opacity: 0.55; }
      #satchel .ks.has { opacity: 1; }
      #satchel .glyph { width: 44px; height: 44px; flex: none; fill: none; stroke: #2a1e3a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      #satchel .glyph text { fill: #2a1e3a; stroke: none; font-size: 22px; font-family: inherit; }
      #satchel .name { font-size: 19px; letter-spacing: 0.06em; }
      #satchel .what { font-size: 15px; font-style: italic; opacity: 0.75; }
      #satchel .goal { font-size: 17px; font-style: italic; line-height: 1.45; margin: 0 0 18px; }
      #satchel .sky { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; margin: 12px 0; }
      #satchel .cname { font-size: 19px; letter-spacing: 0.08em; }
      #satchel .sky.done .cname { color: #8a4a10; }
      #satchel .where { grid-column: 1 / -1; font-size: 14px; font-style: italic; opacity: 0.6; }
      #satchel .dots i { display: inline-block; width: 9px; height: 9px; margin-left: 5px; border-radius: 50%; border: 1px solid #2a1e3a; }
      #satchel .dots i.on { background: #c27a2a; border-color: #8a4a10; box-shadow: 0 0 6px rgba(255,170,80,0.8); }
      #satchel .total { margin-top: 20px; font-style: italic; font-size: 16px; }
      #satchel .foot { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 13px; letter-spacing: 0.3em; opacity: 0.5; }
      @media (max-width: 700px) { #satchel .page { grid-template-columns: 1fr; gap: 10px; padding: 24px 20px 40px; } }
      #map .sheet { position: relative; padding: 14px; background: #d9ccb0; box-shadow: 0 20px 60px rgba(0,0,0,0.5); transform: rotate(-0.6deg); }
      #map canvas { display: block; filter: sepia(0.15) contrast(1.05); }
      #map .caption { position: absolute; left: 0; right: 0; bottom: -34px; text-align: center; font-style: italic; letter-spacing: 0.3em; opacity: 0.75; }
      #map .caption span { margin-left: 2em; font-size: 13px; opacity: 0.6; letter-spacing: 0.2em; }
      #menu .panel { width: min(440px, 86vw); text-align: center; max-height: 92vh; overflow-y: auto; padding: 8px 6px; }
      #menu .title { font-size: 40px; font-weight: 300; letter-spacing: 0.55em; margin-left: 0.55em; }
      #menu .sub { font-style: italic; letter-spacing: 0.25em; opacity: 0.6; margin: 4px 0 30px; min-height: 1.2em; }
      #menu .item {
        display: block; width: 100%; margin: 6px 0; padding: 12px 0; background: none; border: none; color: inherit; cursor: pointer;
        font-family: inherit; font-size: 22px; letter-spacing: 0.18em; transition: color 0.2s, letter-spacing 0.3s;
      }
      #menu .item:hover { color: #ffb065; letter-spacing: 0.24em; }
      #menu .item.quiet { font-size: 17px; opacity: 0.6; margin-top: 18px; }
      #menu .item.back { font-size: 17px; opacity: 0.7; margin-top: 22px; }
      #menu .item.danger { color: #ff8a6e; }
      #menu .group { text-align: left; margin: 0 0 22px; }
      #menu .label { font-size: 13px; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.55; margin-bottom: 10px; }
      #menu .note { font-style: italic; font-size: 15px; opacity: 0.6; margin-top: 8px; }
      #menu .segs { display: flex; gap: 8px; }
      #menu .seg {
        flex: 1; padding: 9px 0; background: rgba(243, 230, 218, 0.06); border: 1px solid rgba(243, 230, 218, 0.25); color: inherit;
        font-family: inherit; font-size: 17px; letter-spacing: 0.1em; cursor: pointer; border-radius: 2px;
      }
      #menu .seg.on { background: rgba(255, 176, 101, 0.18); border-color: #ffb065; color: #ffd4a8; }
      #menu .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0; font-size: 18px; }
      #menu input[type=range] { width: 58%; accent-color: #ffb065; }
      #menu input[type=checkbox] { width: 18px; height: 18px; accent-color: #ffb065; }
      #menu .controls { display: grid; grid-template-columns: auto 1fr; gap: 10px 22px; text-align: left; font-size: 17px; }
      #menu .controls .key { letter-spacing: 0.15em; color: #ffd4a8; white-space: nowrap; }
      #menu .controls .what { font-style: italic; opacity: 0.85; }
      #menu .confirm { font-size: 22px; line-height: 1.4; margin-bottom: 24px; }
      #menu .confirm span { display: block; font-size: 16px; font-style: italic; opacity: 0.65; margin-top: 10px; }
      #stats { position: fixed; top: 8px; left: 8px; color: rgba(243,230,218,0.6); font: 11px monospace; pointer-events: none; display: none; }
    </style>
  </head>
  <body>
    <div id="title"><h1>LAPIS</h1><p>beyond the sea</p></div>
    <div id="hint">click to begin</div>
    <div id="prompt"></div>
    <div id="stats"></div>
    <div id="fade"></div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
